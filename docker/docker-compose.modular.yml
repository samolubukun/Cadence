services:
  # S3 Object Storage Provider (MinIO)
  minio:
    image: minio/minio:latest
    container_name: cadence-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - cadence-net

  # MinIO Bucket Auto-Provisioner
  minio-init:
    image: minio/mc:latest
    container_name: cadence-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until /usr/bin/mc alias set localminio http://minio:9000 minioadmin minioadmin; do
        echo 'Waiting for MinIO to be ready...';
        sleep 2;
      done;
      /usr/bin/mc mb localminio/cadence || true;
      /usr/bin/mc anonymous set download localminio/cadence;
      echo 'Cadence S3 Bucket Initialized successfully!';
      exit 0;
      "
    networks:
      - cadence-net

  # 1. Audio Engine (TTS, STT, Voice Changer, AudioGen, MusicGen, ACE-Step, SDXL, Wan2.1)
  cadence-audio:
    build:
      context: ..
      dockerfile: docker/Dockerfile.audio
    container_name: cadence-audio
    restart: unless-stopped
    profiles: ["audio", "all"]
    ports:
      - "8001:8001"
    environment:
      - CADENCE_API_KEY=${CADENCE_API_KEY:-cadence-secret-key}
      - R2_MOUNT_PATH=/r2
    volumes:
      - cadence_storage:/r2
      - cadence_weights_cache:/root/.cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - cadence-net

  # 2. Studio Engine (Demucs Stem Split, RVC Singing Conversion, Resemble Enhance)
  cadence-studio:
    build:
      context: ..
      dockerfile: docker/Dockerfile.studio
    container_name: cadence-studio
    restart: unless-stopped
    profiles: ["studio", "all"]
    ports:
      - "8005:8005"
    environment:
      - CADENCE_API_KEY=${CADENCE_API_KEY:-cadence-secret-key}
      - R2_MOUNT_PATH=/r2
    volumes:
      - cadence_storage:/r2
      - cadence_weights_cache:/root/.cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - cadence-net

  # 3. Viral Clipper Engine (Whisper + Qwen2.5 Virality, YOLO11 Reframe, NVENC Shorts)
  cadence-clipper:
    build:
      context: ..
      dockerfile: docker/Dockerfile.clipper
    container_name: cadence-clipper
    restart: unless-stopped
    profiles: ["clipper", "all"]
    ports:
      - "8006:8006"
    environment:
      - CADENCE_API_KEY=${CADENCE_API_KEY:-cadence-secret-key}
      - R2_MOUNT_PATH=/r2
    volumes:
      - cadence_storage:/r2
      - cadence_weights_cache:/root/.cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - cadence-net

  # 4. Real-Time Voice Agent (Silero VAD, NVIDIA Parakeet / Whisper, Qwen2.5, Kokoro-82M)
  cadence-agent:
    build:
      context: ..
      dockerfile: docker/Dockerfile.agent
    container_name: cadence-agent
    restart: unless-stopped
    profiles: ["agent", "all"]
    ports:
      - "8007:8007"
    environment:
      - CADENCE_API_KEY=${CADENCE_API_KEY:-cadence-secret-key}
      - R2_MOUNT_PATH=/r2
    volumes:
      - cadence_storage:/r2
      - cadence_weights_cache:/root/.cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - cadence-net

  # 5. Qwen Image Engine (Qwen-Image-2.1 DiT + Qwen3-VL Typography & Inpainting)
  cadence-qwen:
    build:
      context: ..
      dockerfile: docker/Dockerfile.qwen
    container_name: cadence-qwen
    restart: unless-stopped
    profiles: ["vision", "all"]
    ports:
      - "8008:8008"
    environment:
      - CADENCE_API_KEY=${CADENCE_API_KEY:-cadence-secret-key}
      - R2_MOUNT_PATH=/r2
    volumes:
      - cadence_storage:/r2
      - cadence_weights_cache:/root/.cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - cadence-net

  # 6. SenseNova Engine (SenseNova-U1.5-8B MoT Photorealism & Multi-Image Transforms)
  cadence-sensenova:
    build:
      context: ..
      dockerfile: docker/Dockerfile.sensenova
    container_name: cadence-sensenova
    restart: unless-stopped
    profiles: ["vision", "all"]
    ports:
      - "8009:8009"
    environment:
      - CADENCE_API_KEY=${CADENCE_API_KEY:-cadence-secret-key}
      - R2_MOUNT_PATH=/r2
    volumes:
      - cadence_storage:/r2
      - cadence_weights_cache:/root/.cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - cadence-net

volumes:
  minio_data:
  cadence_storage:
  cadence_weights_cache:

networks:
  cadence-net:
    driver: bridge
