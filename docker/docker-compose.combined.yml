services:
  # S3 Object Storage Provider (MinIO)
  minio:
    image: minio/minio:latest
    container_name: cadence-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - cadence-net

  # MinIO Bucket Auto-Provisioner
  minio-init:
    image: minio/mc:latest
    container_name: cadence-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until /usr/bin/mc alias set localminio http://minio:9000 minioadmin minioadmin; do
        echo 'Waiting for MinIO to be ready...';
        sleep 2;
      done;
      /usr/bin/mc mb localminio/cadence || true;
      /usr/bin/mc anonymous set download localminio/cadence;
      echo 'Cadence S3 Bucket Initialized successfully!';
      exit 0;
      "
    networks:
      - cadence-net

  # Cadence All-in-One Engine (Monolith)
  cadence-all-in-one:
    build:
      context: ..
      dockerfile: docker/Dockerfile.combined
    container_name: cadence-all-in-one
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - CADENCE_API_KEY=${CADENCE_API_KEY:-cadence-secret-key}
      - R2_MOUNT_PATH=/r2
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-minioadmin}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-minioadmin}
      - S3_BUCKET_NAME=cadence
      - S3_FORCE_PATH_STYLE=true
    volumes:
      - cadence_storage:/r2
      - cadence_weights_cache:/root/.cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - cadence-net

volumes:
  minio_data:
  cadence_storage:
  cadence_weights_cache:

networks:
  cadence-net:
    driver: bridge
